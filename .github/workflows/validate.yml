name: Validate plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_plugin.py

  # Always resolves to the highest 1.x adrplus release, including pre-releases
  # (see README.md "Prerequisite" for the minimum: 1.0.0-beta3). This job is
  # what catches drift between SKILL.md's documented flags and the CLI's real
  # --help output as new 1.x releases ship - bump the range's floor here (and
  # re-verify skill/agents) only if the minimum supported version changes.
  adrplus-compat:
    runs-on: ubuntu-latest
    env:
      ADRPLUS_VERSION: "[1.0.0-beta3,2.0.0)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install -g adrplus --version "${{ env.ADRPLUS_VERSION }}"
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_adrplus_compat.py
