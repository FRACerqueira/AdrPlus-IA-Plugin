name: Validate plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_plugin.py

  # Pinned to the last version this plugin was verified against (see README.md
  # "Prerequisite"). Bump ADRPLUS_VERSION + re-verify skill/agents together
  # whenever a new adrplus release ships - this job is what catches drift
  # between SKILL.md's documented flags and the CLI's real --help output.
  adrplus-compat:
    runs-on: ubuntu-latest
    env:
      ADRPLUS_VERSION: 1.0.0-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install -g adrplus --version ${{ env.ADRPLUS_VERSION }}
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_adrplus_compat.py
